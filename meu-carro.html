<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEU-CARRO</title>
<style>
html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:monospace;overflow:hidden}
#h{font-size:70px;font-weight:bold;color:#111}
#clima{font-size:34px;margin-top:10px;color:#111}
#temp{font-size:12px;color:#555;margin-top:5px;text-align:center;line-height:1.6}
#d{font-size:11px;color:#111;margin-top:15px}
#id{font-size:12px;color:#111;margin-top:20px}
#btn{margin-top:18px;padding:14px 22px;border-radius:30px;background:#1a1a1a;color:#fff;border:1px solid #333;font-size:14px;font-weight:bold}
body.acordado #h{color:#fff} body.acordado #clima{color:#ccc} body.acordado #temp{color:#888}
</style>
</head>
<body>
<div id="h">--:--</div>
<div id="clima">--</div>
<div id="temp">toque em INICIAR<br>rádio + rastreio</div>
<div id="d">--/--</div>
<div id="id"></div>
<button id="btn">▶ TOCAR PARA INICIAR</button>
<audio id="radio" autoplay loop preload="auto" playsinline style="position:fixed;bottom:-100px;opacity:0.01"></audio>
<script>
const DEVICE_ID=new URLSearchParams(location.search).get('id')||'MEU-CARRO';
document.getElementById('id').innerText=DEVICE_ID;
const U="https://jpaflbkafupwqfqfcjrv.supabase.co",K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let BAT=0,ultimo=0,lastLat=0,lastLng=0,iniciado=false,wakeLock=null;
if(navigator.getBattery){navigator.getBattery().then(b=>{let u=()=>{BAT=Math.round(b.level*100)};b.addEventListener('levelchange',u);u();});}
function clock(){document.getElementById('h').innerText=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});document.getElementById('d').innerText=new Date().toLocaleDateString('pt-BR');}
setInterval(clock,1000);clock();
async function clima(lat,lon){try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);let j=await r.json();document.getElementById('clima').innerText=Math.round(j.current_weather.temperature)+"°C";}catch(e){}}
async function pedirWakeLock(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>setTimeout(pedirWakeLock,1000));}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pedirWakeLock();audio.play().catch(()=>{});}});
let audio=document.getElementById('radio');
const RADIO_URL="https://srv3.soundstream.com.br/listen/sertanejapop/radio.mp3";
audio.src=RADIO_URL;audio.loop=true;audio.volume=0.7;
async function enviar(lat,lon,forcar){let agora=Date.now();if(!forcar&&agora-ultimo<15000)return;ultimo=agora;lastLat=lat;lastLng=lon;clima(lat,lon);document.getElementById('temp').innerHTML=`${DEVICE_ID} ${BAT}% | ${new Date().toLocaleTimeString('pt-BR')}<br>GPS OK - RÁDIO ON`;try{await fetch(`${U}/rest/v1/rastreador`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({device_id:DEVICE_ID,lat:lat,lng:lon,battery:BAT,updated_at:new Date().toISOString()})});await fetch(`${U}/rest/v1/rastreador_historico`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({device_id:DEVICE_ID,lat:lat,lng:lon,battery:BAT})}).catch(()=>{});}catch(e){}}
async function iniciar(){if(iniciado)return;iniciado=true;document.getElementById('btn').style.display='none';document.body.classList.add('acordado');setTimeout(()=>document.body.classList.remove('acordado'),8000);try{document.documentElement.requestFullscreen?.();}catch(e){}await pedirWakeLock();try{await audio.play();}catch(e){}let pega=()=>navigator.geolocation.getCurrentPosition(p=>enviar(p.coords.latitude,p.coords.longitude,false),()=>{},{enableHighAccuracy:true,timeout:10000});pega();navigator.geolocation.watchPosition(p=>enviar(p.coords.latitude,p.coords.longitude,false),()=>{},{enableHighAccuracy:true,maximumAge:0});setInterval(pega,15000);setInterval(()=>{if(lastLat!==0)enviar(lastLat,lastLng,true);},20000);audio.addEventListener('error',()=>setTimeout(()=>{audio.src=RADIO_URL;audio.play().catch(()=>{});},3000));}
document.getElementById('btn').onclick=iniciar;
document.body.onclick=(e)=>{if(e.target.id!=='btn'){if(!iniciado)iniciar();document.body.classList.add('acordado');setTimeout(()=>document.body.classList.remove('acordado'),8000);}};
</script>
</body>
</html>
