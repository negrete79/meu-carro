<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FROTA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#000;overflow:hidden}
#map{position:fixed;inset:0;z-index:1}
.topo{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.topo > *{pointer-events:auto}
.btn-topo{background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.seg{display:flex;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#ccc;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:#fff;color:#000}
.btn-carro{position:fixed;right:12px;top:70px;z-index:1000;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.painel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:rgba(10,18,25,.92);backdrop-filter:blur(15px);border-top:1px solid rgba(255,255,255,.15);border-radius:20px 20px 0 0;padding:14px 14px 18px;color:#fff;transition:transform .3s}
.painel.escondido{transform:translateY(calc(100% - 38px))}
.puxador{width:60px;height:5px;background:rgba(255,255,255,.3);border-radius:99px;margin:-2px auto 12px}
.linha1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.linha1 h2{margin:0;font-size:22px}
.linha1 p{margin:2px 0 0;color:#9fb0be;font-size:13px}
.btn-esconder{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
.filtros{display:flex;gap:8px;margin:14px 0;overflow-x:auto;padding-bottom:2px}
.filtros button{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.08);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.filtros button.on{background:#a3e635;color:#000;border-color:#a3e635}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px}
.card small{color:#9fb0be;font-size:11px;letter-spacing:.5px}
.card b{display:block;font-size:16px;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;background:#a3e635;display:inline-block;box-shadow:0 0 8px #a3e635}
.precisao{text-align:center;color:#9fb0be;font-size:13px;margin:12px 0 8px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acoes button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.15);padding:12px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div class="topo">
<button class="btn-topo" onclick="atualizarAgora()" id="btnAtualizar">↻ Atualizar</button>
<div class="seg"><button id="btnRua" onclick="setTipo('rua')">Rua</button><button id="btnSat" onclick="setTipo('sat')" class="on">Satélite</button></div>
</div>
<button class="btn-carro" onclick="voltarProCarro()">🚗</button>
<div class="painel" id="painel">
<div class="puxador" onclick="togglePainel()"></div>
<div class="linha1">
<div><h2 id="titulo">FROTA - 0 carros</h2><p>Média de bateria dos carros</p></div>
<button class="btn-esconder" onclick="togglePainel()" id="btnEsconder">Esconder ↓</button>
</div>
<div class="filtros">
<button id="fTODOS" class="on" onclick="setFiltro('TODOS')">🌐 TODOS</button>
<button id="fCARRO-1" onclick="setFiltro('CARRO-1')">📍 CARRO-1</button>
<button id="fCARRO-2" onclick="setFiltro('CARRO-2')">📍 CARRO-2</button>
</div>
<div class="cards">
<div class="card"><small>BATERIA</small><b id="bateria">--</b></div>
<div class="card"><small>ATUALIZADO</small><b id="atualizado">--</b></div>
<div class="card"><small>STATUS</small><b><span class="dot"></span> <span id="qtd">0 carros</span></b></div>
</div>
<div class="precisao" id="precisao">Precisão: aguardando GPS...</div>
<div class="acoes">
<button onclick="toggleHistorico()" id="btnHist">🕐 Histórico: OFF</button>
<button onclick="abrirGoogle()">📍 Google Maps</button>
</div>
</div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let map=L.map('map',{zoomControl:false}).setView([-20.38,-43.5],15);
let camadaRua=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
let camadaSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
camadaSat.addTo(map);
let markers={}, linhas={}, hist=[], histOn=false, FILTRO='TODOS', dados=[];
function setTipo(t){
  if(t==='rua'){ map.removeLayer(camadaSat); camadaRua.addTo(map); document.getElementById('btnRua').className='on'; document.getElementById('btnSat').className=''; }
  else{ map.removeLayer(camadaRua); camadaSat.addTo(map); document.getElementById('btnSat').className='on'; document.getElementById('btnRua').className=''; }
}
function togglePainel(){
  let p=document.getElementById('painel'); let esc=p.classList.toggle('escondido');
  document.getElementById('btnEsconder').innerText=esc?'Mostrar ↑':'Esconder ↓';
}
function setFiltro(f){
  FILTRO=f;
  document.getElementById('fTODOS').className=f==='TODOS'?'on':'';
  document.getElementById('fCARRO-1').className=f==='CARRO-1'?'on':'';
  document.getElementById('fCARRO-2').className=f==='CARRO-2'?'on':'';
  desenhar();
}
function tempoAtras(iso){
  if(!iso) return '--';
  let s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<5) return 'agora';
  if(s<60) return 'há '+s+'s';
  let m=Math.floor(s/60); if(m<60) return 'há '+m+'min';
  return 'há '+Math.floor(m/60)+'h';
}
function txtBateria(c){ return (c.charging?'⚡ ':'')+'🔋 '+(c.battery||0)+'%'; }
function desenhar(){
  for(let k in markers){ map.removeLayer(markers[k]); delete markers[k]; }
  for(let k in linhas){ map.removeLayer(linhas[k]); delete linhas[k]; }
  let lista = FILTRO==='TODOS' ? dados : dados.filter(d=>d.device_id===FILTRO);
  if(lista.length===0) return;
  let somaBat=0, bounds=[], algumCarregando=false;
  lista.forEach(c=>{
    somaBat+=c.battery||0;
    if(c.charging) algumCarregando=true;
    let icone=L.divIcon({html:'<div style="font-size:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))">🚗</div>',iconSize:[32,32],className:''});
    markers[c.device_id]=L.marker([c.lat,c.lng],{icon:icone}).addTo(map).bindPopup('<b>'+c.device_id+'</b><br>'+txtBateria(c)+'<br>'+tempoAtras(c.updated_at));
    bounds.push([c.lat,c.lng]);
  });
  let media=Math.round(somaBat/lista.length);
  let primeiro=lista[0];
  document.getElementById('titulo').innerText='FROTA - '+lista.length+' carros';
  document.getElementById('bateria').innerText=(algumCarregando?'⚡ ':'')+'🔋 '+media+'%';
  document.getElementById('atualizado').innerText=tempoAtras(primeiro.updated_at);
  document.getElementById('qtd').innerText=lista.length+' carros';
  document.getElementById('precisao').innerText='Precisão: '+(primeiro.accuracy?Math.round(primeiro.accuracy)+'m':'aguardando GPS...')+' • '+primeiro.device_id+(primeiro.charging?' • ⚡ Carregando':'');
  if(bounds.length>0) map.fitBounds(bounds,{padding:[60,60],maxZoom:17});
  if(histOn && lista.length===1){
    let pts=hist.filter(h=>h.device_id===lista[0].device_id).map(h=>[h.lat,h.lng]);
    if(pts.length>1) linhas['h']=L.polyline(pts,{color:'#a3e635',weight:4}).addTo(map);
  }
}
async function refresh(){
  try{
    let r=await fetch(U+'/rest/v1/rastreador?select=*&order=updated_at.desc&limit=50',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'});
    let j=await r.json();
    let mapa={};
    j.forEach(c=>{ if(!mapa[c.device_id]) mapa[c.device_id]=c; });
    dados=Object.values(mapa).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
    desenhar();
  }catch(e){}
}
function atualizarAgora(){
  let b=document.getElementById('btnAtualizar');
  b.innerText='✓ Atualizado'; setTimeout(()=>b.innerText='↻ Atualizar',1200);
  refresh(); voltarProCarro();
}
function voltarProCarro(){
  let lista = FILTRO==='TODOS' ? dados : dados.filter(d=>d.device_id===FILTRO);
  if(lista.length===0) return;
  if(lista.length===1) map.setView([lista[0].lat,lista[0].lng],17);
  else map.fitBounds(lista.map(c=>[c.lat,c.lng]),{padding:[60,60],maxZoom:16});
}
function toggleHistorico(){
  histOn=!histOn;
  document.getElementById('btnHist').innerText=histOn?'🕐 Histórico: ON':'🕐 Histórico: OFF';
  if(histOn) carregarHist(); else desenhar();
}
async function carregarHist(){
  try{
    let r=await fetch(U+'/rest/v1/rastreador?select=*&order=updated_at.desc&limit=200',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'});
    hist=await r.json(); desenhar();
  }catch(e){}
}
function abrirGoogle(){
  let lista = FILTRO==='TODOS' ? dados : dados.filter(d=>d.device_id===FILTRO);
  if(lista.length===0) return;
  window.open('https://www.google.com/maps?q='+lista[0].lat+','+lista[0].lng,'_blank');
}
refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
