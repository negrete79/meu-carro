<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FROTA</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}.hidden{display:none!important}html,body{height:100%;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;z-index:1}
.topbar{position:fixed;top:12px;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:999;display:flex;justify-content:space-between;gap:8px}
.glass-btn{background:rgba(20,20,20,.45);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:18px;color:#fff;padding:11px 14px;cursor:pointer;font-size:13px}
.layer-btn{background:none;border:none;color:#aaa;cursor:pointer;padding:6px 8px}.layer-btn.ativo{background:rgba(255,255,255,.15);color:#fff;border-radius:10px}
#btnCar{position:fixed;right:16px;bottom:110px;z-index:1000;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.35);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);font-size:26px;cursor:pointer;display:none;align-items:center;justify-content:center;opacity:.35}
#btnCar.show{display:flex}
/* BARRA VIDRO FUMÊ QUASE TRANSPARENTE */
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:999;width:100%;max-width:520px;background:rgba(15,15,15,.35);backdrop-filter:blur(25px) saturate(1.2);-webkit-backdrop-filter:blur(25px) saturate(1.2);border-top:1px solid rgba(255,255,255,.18);border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08);border-radius:28px 28px 0 0;transition:transform .35s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
#sheet.collapsed{transform:translateX(-50%) translateY(calc(100% - 56px))}
#sheet.hiddenBar{transform:translateX(-50%) translateY(100%)}
#sheet .handle{width:44px;height:5px;background:rgba(255,255,255,.4);border-radius:3px;margin:10px auto 6px;cursor:pointer}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:0 22px}
.vname{font-size:20px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.8)}.vid{font-size:11px;color:rgba(255,255,255,.7);margin-bottom:10px;padding:0 22px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.btn-hide{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(10px)}
.sheet-content{padding:4px 22px 22px}
/* BOTÕES DOS CARROS DENTRO DA BARRA */
.carros-dentro{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.carros-dentro::-webkit-scrollbar{display:none}
.carros-dentro button{white-space:nowrap;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:9px 14px;cursor:pointer;font-size:13px}
.carros-dentro button.ativo{background:rgba(255,255,255,.9);color:#000;font-weight:700}
.carros-dentro button.todos.ativo{background:#a6ff00;color:#000}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}.meta-cell{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}.meta-cell .lbl{font-size:10px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:4px}.meta-cell .val{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.6)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.dot.on{background:#a6ff00;box-shadow:0 0 10px #a6ff00}.dot.off{background:#ff4444}.sheet-actions{display:flex;gap:10px}.sheet-btn{flex:1;padding:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;cursor:pointer;backdrop-filter:blur(10px)}
#showBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:998;background:rgba(20,20,20,.5);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:10px 18px;font-size:13px;cursor:pointer;display:none}
#showBar.show{display:block}
#emptyState{position:fixed;inset:0;z-index:998;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;padding:24px;text-align:center}
.bat-icon{width:30px;height:15px;border:2px solid #fff;border-radius:4px;position:relative;flex-shrink:0;display:inline-block;background:rgba(0,0,0,.3);overflow:hidden}
.bat-icon::after{content:'';position:absolute;right:-5px;top:3px;width:3px;height:6px;background:#fff;border-radius:1px}
.bat-fill{height:100%;display:block}.bat-fill.high{background:#a6ff00}.bat-fill.med{background:#ffcc00}.bat-fill.low{background:#ff4444}
/* ÍCONE DE LOCALIZAÇÃO - TODOS IGUAIS */
.pin{font-size:36px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));line-height:1;text-align:center}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar"><button class="glass-btn" onclick="history.back()">← Voltar</button><div class="glass-btn" style="display:flex;gap:2px"><button class="layer-btn" id="btnRua" onclick="setLayer('rua')">Rua</button><button class="layer-btn ativo" id="btnSat" onclick="setLayer('sat')">Satélite</button></div></div>
<button id="btnCar" onclick="voltarProCarro()">📍</button>
<div id="emptyState" class="hidden"><h2>Nenhum veículo online</h2><p style="color:#aaa;margin:10px 0">Ligue um carro com INICIAR</p></div>
<div id="sheet" class="collapsed"><div class="handle" onclick="toggleSheet()"></div><div class="sheet-top"><div class="vname" id="sName">FROTA</div><button class="btn-hide" onclick="esconderBarra()">Esconder ↓</button></div><div class="vid" id="sId">Toque em um carro para ver detalhes</div><div class="sheet-content">
<div class="carros-dentro" id="carrosBar"><button class="todos ativo" onclick="verTodos()">🌐 TODOS</button><button onclick="selecionarCarro('CARRO-1')">📍 CARRO-1</button><button onclick="selecionarCarro('CARRO-2')">📍 CARRO-2</button><button onclick="selecionarCarro('CARRO-3')">📍 CARRO-3</button></div>
<div class="meta-grid"><div class="meta-cell"><div class="lbl">🔋 Bateria</div><div class="val"><span class="bat-icon"><span class="bat-fill high" id="batFill" style="width:0%"></span></span><span id="sBat">--%</span></div></div><div class="meta-cell"><div class="lbl">Atualizado</div><div class="val" id="sTime">--</div></div><div class="meta-cell"><div class="lbl">Status</div><div class="val" id="sStatus">--</div></div></div><div class="sheet-actions"><button class="sheet-btn" onclick="voltarProCarro()">🎯 Focar</button><button class="sheet-btn" onclick="openGoogleMaps()">📍 Google Maps</button></div></div></div>
<button id="showBar" onclick="mostrarBarra()">▲ FROTA</button>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co";
const K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const H={apikey:K,Authorization:"Bearer "+K};
const ONLINE_MS=45000;
let map=L.map('map',{zoomControl:false}).setView([-20.385,-43.503],13);
map.createPane('labels');map.getPane('labels').style.zIndex=450;map.getPane('labels').style.pointerEvents='none';
let ruaLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
let satLayer=L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20}).addTo(map);
let lblLayer=L.tileLayer('https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}',{maxZoom:20,pane:'labels'}).addTo(map);
let currentLayer='sat',markers={},seguindo=null,lastData=null,modoTodos=true,lastDataById={};
function setLayer(l){if(l===currentLayer)return;currentLayer=l;if(l==='rua'){map.removeLayer(satLayer);map.removeLayer(lblLayer);ruaLayer.addTo(map);document.getElementById('btnRua').classList.add('ativo');document.getElementById('btnSat').classList.remove('ativo');}else{map.removeLayer(ruaLayer);satLayer.addTo(map);lblLayer.addTo(map);document.getElementById('btnSat').classList.add('ativo');document.getElementById('btnRua').classList.remove('ativo');}}
function timeAgo(u){if(!u)return 'nunca';let s=Math.floor((Date.now()-new Date(u).getTime())/1000);if(s<5)return 'agora';if(s<60)return 'há '+s+'s';return 'há '+Math.floor(s/60)+'min';}
function updateBat(p){let f=document.getElementById('batFill');f.style.width=p+'%';f.className='bat-fill '+(p>50?'high':p>20?'med':'low');document.getElementById('sBat').innerText=p+'%';}
function toggleSheet(){let s=document.getElementById('sheet');s.classList.remove('hiddenBar');s.classList.toggle('collapsed');document.getElementById('showBar').classList.remove('show');}
function esconderBarra(){document.getElementById('sheet').classList.add('hiddenBar');document.getElementById('showBar').classList.add('show');}
function mostrarBarra(){let s=document.getElementById('sheet');s.classList.remove('hiddenBar');s.classList.remove('collapsed');document.getElementById('showBar').classList.remove('show');}
function selecionarCarro(id){modoTodos=false;seguindo=id;document.querySelectorAll('#carrosBar button').forEach(b=>b.classList.remove('ativo'));let btns=[...document.querySelectorAll('#carrosBar button')];let b=btns.find(x=>x.textContent.includes(id));if(b)b.classList.add('ativo');if(markers[id]){map.flyTo(markers[id].getLatLng(),17,{duration:1.2});mostrarInfo(id);}document.getElementById('sheet').classList.remove('collapsed');}
function verTodos(){modoTodos=true;seguindo=null;document.querySelectorAll('#carrosBar button').forEach(b=>b.classList.remove('ativo'));document.querySelector('.todos').classList.add('ativo');let pts=Object.values(markers).map(m=>m.getLatLng());if(pts.length)map.flyToBounds(L.latLngBounds(pts).pad(0.25),{duration:1});document.getElementById('sName').innerText='FROTA';document.getElementById('sId').innerText=pts.length+' veículos no mapa';}
map.on('dragstart',()=>{if(seguindo){seguindo=null;document.getElementById('btnCar').classList.add('show');}});
function voltarProCarro(){if(!seguindo && Object.keys(markers).length==1) seguindo=Object.keys(markers)[0];if(!seguindo) return;document.getElementById('btnCar').classList.remove('show');if(markers[seguindo])map.flyTo(markers[seguindo].getLatLng(),17,{duration:1.2});}
function mostrarInfo(id){let d=lastDataById[id];if(!d)return;lastData=d;document.getElementById('sheet').classList.remove('collapsed');document.getElementById('sName').innerText=d.device_id;document.getElementById('sId').innerText='ID: '+d.device_id;updateBat(d.battery||0);document.getElementById('sTime').innerText=timeAgo(d.updated_at);let online=(Date.now()-new Date(d.updated_at).getTime())<ONLINE_MS;document.getElementById('sStatus').innerHTML=`<span class="dot ${online?'on':'off'}"></span>${online?'ONLINE':'OFFLINE'}`;}
function openGoogleMaps(){if(!lastData)return;window.open(`https://www.google.com/maps?q=${lastData.lat},${lastData.lng}`,'_blank');}
// ÍCONE DE LOCALIZAÇÃO PARA TODOS - SEM AZUL
function criarPin(){return L.divIcon({className:'',html:'<div class="pin">📍</div>',iconSize:[36,36],iconAnchor:[18,34]});}
async function refresh(){try{let r=await fetch(`${U}/rest/v1/rastreador?order=updated_at.desc`,{headers:H,cache:'no-store'});let d=await r.json();if(!d.length){document.getElementById('emptyState').classList.remove('hidden');return;}document.getElementById('emptyState').classList.add('hidden');d.forEach(car=>{lastDataById[car.device_id]=car;let ll=[car.lat,car.lng];if(!markers[car.device_id]){let m=L.marker(ll,{icon:criarPin()}).addTo(map);m.on('click',()=>{seguindo=car.device_id;mostrarInfo(car.device_id);});markers[car.device_id]=m;if(modoTodos){let pts=Object.values(markers).map(x=>x.getLatLng());map.fitBounds(L.latLngBounds(pts).pad(0.25));}}else{markers[car.device_id].setLatLng(ll);if(seguindo===car.device_id)map.panTo(ll);}if(seguindo===car.device_id)mostrarInfo(car.device_id);});}catch(e){console.log(e);}}
refresh();setInterval(refresh,5000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
